name: Validate modules

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build and import modules
        shell: pwsh
        run: ./build/Test-Modules.ps1
      - name: Run unit tests
        shell: pwsh
        run: ./build/Invoke-Tests.ps1

  validate-portable:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build and import portable modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Build and import each portable module (Windows module is excluded; it
          # contains WinRT-only assemblies that cannot load on Linux).
          foreach ($module in @('Shmuelie.Git', 'Shmuelie.Copilot', 'Shmuelie.Node', 'Shmuelie.DotNet', 'Shmuelie.Utilities', 'Shmuelie.Dsc', 'Shmuelie.PackageManagement')) {
              Write-Host "::group::Building $module"
              & ./build/Build-Module.ps1 -Module $module | Out-Null
              Write-Host "::endgroup::"
          }
      - name: Run repeat-build tests
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -Path ./tests/Build.Tests.ps1
      - name: Run package orchestration tests
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -Path ./tests/Shmuelie.PackageManagement.Tests.ps1
      - name: Run portable .NET tool tests
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -Path ./tests/Shmuelie.DotNet.Tests.ps1
      - name: Verify symbolic links on a case-sensitive filesystem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module -ListAvailable Pester |
              Where-Object { $_.Version -ge [version]'6.2.0' -and $_.Version.Major -eq 6 -and -not $_.PrivateData.PSData.Prerelease } |
              Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) { throw 'The preceding test steps must provide stable Pester 6.2+.' }
          Import-Module $pester.Path -Force
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Shmuelie.Dsc.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Filter.Tag = 'DscSymbolicLinkCaseSensitive'
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.Result -ne 'Passed' -or $result.PassedCount -ne 2 -or $result.SkippedCount -ne 0) {
              throw 'Both owned case-sensitive filesystem tests must execute and pass.'
          }
