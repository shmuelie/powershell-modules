name: Publish module

on:
  push:
    tags:
      - 'Shmuelie.*-v*'
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish
        required: true
        type: choice
        options:
          - Shmuelie.Git
          - Shmuelie.Copilot
          - Shmuelie.Node
          - Shmuelie.DotNet
          - Shmuelie.Utilities
          - Shmuelie.Dsc
          - Shmuelie.VisualStudio
          - Shmuelie.Windows
          - Shmuelie.PackageManagement

jobs:
  publish:
    runs-on: windows-latest
    environment: powershell-gallery
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Resolve module
        id: module
        shell: pwsh
        env:
          INPUT_MODULE: ${{ inputs.module }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $module = $env:INPUT_MODULE
          $tagVersion = $null
          if (-not $module) {
            if ($env:REF_NAME -notmatch '^(?<module>Shmuelie\.(?:Git|Copilot|Node|DotNet|Utilities|Dsc|VisualStudio|Windows|PackageManagement))-v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Invalid release tag: $env:REF_NAME"
            }
            $module = $Matches.module
            $tagVersion = $Matches.version
          }
          & ./build/Assert-ModulePublishable.ps1 -Module $module
          $manifest = Test-ModuleManifest "./modules/$module/$module.psd1"
          if ($tagVersion -and "$($manifest.Version)" -ne $tagVersion) {
            throw "Tag version $tagVersion does not match manifest version $($manifest.Version)."
          }
          "name=$module" >> $env:GITHUB_OUTPUT
      - name: Validate modules
        shell: pwsh
        run: ./build/Test-Modules.ps1
      - name: Run unit tests
        shell: pwsh
        run: ./build/Invoke-Tests.ps1
      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          MODULE_NAME: ${{ steps.module.outputs.name }}
        run: ./build/Publish-Module.ps1 -Module $env:MODULE_NAME -ApiKey $env:PSGALLERY_API_KEY
